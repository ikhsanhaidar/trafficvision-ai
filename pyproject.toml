[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "trafficvision-ai"
version = "0.1.0"
description = "Reproducible traffic crossing analysis from static-camera video"
requires-python = ">=3.10,<3.13"
license = "AGPL-3.0-only"
dependencies = [
  "ultralytics==8.3.203", "torch==2.8.0", "torchvision==0.23.0",
  "opencv-python==4.12.0.88", "numpy==2.2.6", "av==16.0.1", "lap==0.5.12",
  "fastapi==0.117.1", "uvicorn[standard]==0.37.0", "pydantic==2.11.9",
  "pydantic-settings==2.10.1", "sqlalchemy==2.0.43", "alembic==1.16.5",
  "psycopg[binary]==3.2.10", "redis==5.2.1", "celery[redis]==5.5.3",
  "python-multipart==0.0.22", "pwdlib[argon2]==0.2.1", "PyJWT==2.10.1",
]

[project.scripts]
trafficvision = "trafficvision.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "httpx==0.28.1", "ruff==0.13.1"]

[tool.hatch.build.targets.wheel]
packages = ["backend/trafficvision"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_video: opt-in licensed footage and real checkpoint smoke test"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
